name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the run still going for the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # Pinned rather than macos-latest: WatchList targets iOS 26.2, and the
    # label only moved to a Tahoe image that carries the iOS 26 SDKs recently.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # No Configuration/Secrets.xcconfig is written here on purpose. The unit
      # tests are pure logic — decoding TMDb payloads and the mapping either
      # side of the network calls — so they need no API key, and the app builds
      # without one. If a test ever does need to reach TMDb, write the file from
      # a repository secret at this point.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Resolved rather than hard-coded: the runner image adds and drops
      # simulator runtimes over time, so a pinned "iPhone 17 Pro, OS=26.3.1"
      # would go stale. simctl is asked rather than
      # "xcodebuild -showdestinations", which on a cold runner reports only
      # placeholder destinations until CoreSimulator has enumerated devices.
      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          resolved=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys

          devices = json.load(sys.stdin).get("devices", {})
          best = None
          for runtime, entries in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              # WatchList deploys to iOS 26.2. An older runtime would only fail
              # later, deep in a build log, so it is rejected here.
              if version < (26, 2):
                  continue
              for device in entries:
                  if not device.get("isAvailable"):
                      continue
                  if not device.get("name", "").startswith("iPhone"):
                      continue
                  if best is None or version > best[0]:
                      best = (version, device["udid"], device["name"])
          if best:
              print("%s\t%s\tiOS %d.%d" % (best[1], best[2], best[0][0], best[0][1]))
          ')
          if [ -z "$resolved" ]; then
            echo "No iPhone simulator running iOS 26.2 or newer on this runner."
            echo "Devices present:"
            xcrun simctl list devices
            exit 1
          fi
          echo "Using $(printf '%s' "$resolved" | cut -f2) on $(printf '%s' "$resolved" | cut -f3)"
          printf 'id=%s\n' "$(printf '%s' "$resolved" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project WatchList.xcodeproj \
            -scheme WatchList \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -only-testing:WatchListTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
          | xcbeautify --renderer github-actions

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
